<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111313">
  <meta name="description" content="可設定預備、訓練、休息與訓練組數的間歇計時器。">
  <title>訓練計時器</title>
  <style>
    :root{color-scheme:dark;--page:#111313;--panel:#1a1d1c;--line:#343936;--text:#f5f5ef;--muted:#a7ada7;--gold:#f7c957;--ink:#241b08;--signal:var(--gold);font-family:Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--page);color:var(--text)}
    button,input{font:inherit}
    button{cursor:pointer}
    button:disabled,input:disabled{cursor:default}
    button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    button svg,.brand-icon svg{width:1.15rem;height:1.15rem;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .sprite{position:absolute;width:0;height:0;overflow:hidden}
    .top{border-bottom:1px solid #292d2a;background:#151817}
    .top-inner,.shell{width:min(100% - 3rem,72rem);margin-inline:auto}
    .top-inner{min-height:4.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
    .brand{display:flex;align-items:center;gap:.7rem;font-size:1rem;font-weight:780;letter-spacing:.05em;white-space:nowrap}
    .brand-icon{display:grid;place-items:center;width:2rem;aspect-ratio:1;color:var(--gold);border:1px solid #6b5830;border-radius:.55rem;background:#30281a}
    .utilities{display:flex;gap:.5rem}
    .quiet,.reset,.preset,.step,.sound-test{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;color:var(--text);border:1px solid var(--line);background:#212523;border-radius:.55rem;min-height:2.65rem;padding:.45rem .75rem;font-size:.875rem;font-weight:650}
    .quiet:hover,.reset:hover,.step:hover,.preset:hover,.sound-test:hover{background:#2c302d;border-color:#555e55}
    .quiet[aria-pressed="true"]{color:var(--gold)}
    .shell{padding-block:2.45rem 1.8rem}
    .intro{margin-bottom:1.65rem}
    h1,h2,p{margin:0}
    h1{font-size:clamp(2.05rem,4.2vw,3.05rem);line-height:1.13;letter-spacing:.015em;font-weight:820}
    .grid{display:grid;grid-template-columns:minmax(0,1.64fr) minmax(19rem,1fr);gap:1.2rem;align-items:stretch}
    .clock,.settings{border:1px solid var(--line);border-radius:1.15rem;min-width:0}
    .clock{display:flex;flex-direction:column;padding:1.25rem;background:radial-gradient(ellipse at 50% 37%,#25291f 0,transparent 62%),radial-gradient(#ffffff0e .7px,transparent .8px) 0 0/13px 13px,#191c1a;overflow:hidden}
    .clock[data-phase="train"]{--signal:#a7eb9f}
    .clock[data-phase="rest"]{--signal:#9cd2ee}
    .clock[data-phase="done"],.clock[data-warning="true"]{--signal:#ffc0aa}
    .readout{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0}
    .clock-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
    .round-badge{display:inline-flex;align-items:center;gap:.5rem;color:#e3e7de;background:#101311c7;border:1px solid #3a403b;border-radius:.5rem;padding:.46rem .62rem;font-size:.875rem;white-space:nowrap}
    .round-badge svg{width:1rem;height:1rem;fill:none;stroke:var(--muted);stroke-width:1.6}
    .next{font-size:.875rem;color:var(--muted);text-align:right;line-height:1.35}
    .dial{position:relative;isolation:isolate;display:grid;place-items:center;width:min(100%,20.25rem);aspect-ratio:1;margin:.85rem auto .65rem;flex:none}
    .dial::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -.4deg,#828b76 0deg .8deg,transparent .8deg 6deg);mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px) calc(100% - 1px),transparent 100%);opacity:.55;z-index:-1}
    .dial::after{content:"";position:absolute;inset:1.65rem;border:1px solid #3b4235;border-radius:50%;background:radial-gradient(circle at 50% 42%,#1a2018,#141715 74%);z-index:-1}
    .ring{position:absolute;inset:.7rem;width:calc(100% - 1.4rem);height:calc(100% - 1.4rem);overflow:visible;transform:rotate(-90deg);fill:none}
    .ring-track{stroke:#3d4439;stroke-width:3}
    .ring-progress{stroke:var(--signal);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:var(--offset,0);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--signal),transparent 55%))}
    .dial-content{text-align:center;position:relative;display:grid;justify-items:center;gap:.32rem}
    .phase-tag{display:inline-flex;align-items:center;gap:.44rem;color:var(--signal);font-size:.9rem;letter-spacing:.08em;font-weight:800}
    .phase-tag::before{content:"";width:.43rem;aspect-ratio:1;border-radius:50%;background:currentColor;box-shadow:0 0 .6rem currentColor}
    .digits{color:var(--text);font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:clamp(3.35rem,9.4vw,5.05rem);line-height:1.04;letter-spacing:-.085em;font-weight:750;font-variant-numeric:tabular-nums;padding-right:.085em}
    .time-caption{color:var(--muted);font-size:.875rem;letter-spacing:.09em}
    .sequence{display:flex;justify-content:center;align-items:center;gap:.6rem;color:var(--muted);padding:.2rem 0 1.15rem;font-size:.875rem;line-height:1.25;list-style:none;margin:0}
    .sequence li{white-space:nowrap;display:flex;align-items:center;gap:.6rem}
    .sequence li[hidden]{display:none}
    .sequence li+li::before{content:"";display:block;width:.9rem;height:1px;background:#5a6259}
    .sequence li:first-child[hidden]+li::before{display:none}
    .sequence li[data-current="true"] span{color:var(--signal);font-weight:750}
    .actions{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.65rem}
    .primary{display:flex;align-items:center;justify-content:center;gap:.58rem;border:1px solid #ffd781;border-radius:.65rem;background:var(--gold);color:var(--ink);min-height:3.4rem;padding:.65rem 1rem;font-size:1.05rem;font-weight:850;letter-spacing:.04em;box-shadow:inset 0 1px 0 #ffffff4f}
    .primary:hover{background:#ffda7e}
    .primary:active,.quiet:active,.step:active{transform:translateY(1px)}
    .reset{padding-inline:1rem;min-height:3.4rem;background:#242925}
    .reset:disabled{color:#959f95;background:#1b201c}
    .settings{padding:1.25rem 1.25rem 1rem;background:var(--panel);display:flex;flex-direction:column}
    .settings-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1.05rem}
    h2{font-size:1.2rem;letter-spacing:.03em;font-weight:800}
    .config-status{color:var(--muted);font-size:.8125rem;text-align:right}
    .presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem;border:0;margin:0;padding:0 0 .85rem;min-width:0}
    .preset{padding:.4rem .2rem;min-height:2.5rem;font-size:.875rem;white-space:nowrap}
    .preset[aria-pressed="true"]{color:var(--gold);border-color:#7f6836;background:#342c1e}
    .presets:disabled .preset{opacity:.63}
    .fields{margin:0;padding:0;border:0;min-width:0}
    .row{display:flex;align-items:center;justify-content:space-between;gap:.45rem;padding:.69rem 0;border-top:1px solid var(--line);min-height:4.25rem}
    .field-label{display:grid;gap:.18rem;font-size:1rem;font-weight:720;white-space:nowrap}
    .field-note{font-size:.8125rem;font-weight:400;color:var(--muted)}
    .stepper{display:flex;align-items:center;gap:.25rem;flex-shrink:0}
    .step{width:2.25rem;height:2.45rem;min-height:0;padding:0;font-size:1.25rem;font-weight:500}
    .step:disabled{opacity:.42}
    .number{display:flex;align-items:center;justify-content:center;gap:.15rem;min-width:4.15rem}
    .number input{appearance:textfield;-moz-appearance:textfield;width:2.5rem;color:var(--text);background:transparent;text-align:center;border:0;border-radius:.2rem;font-family:ui-monospace,Consolas,monospace;font-size:1.19rem;font-weight:700;padding:.2rem .05rem;font-variant-numeric:tabular-nums}
    .number input::-webkit-inner-spin-button,.number input::-webkit-outer-spin-button{appearance:none;margin:0}
    .number input:disabled{opacity:.72}
    .suffix{font-size:.8125rem;color:var(--muted)}
    .settings-foot{margin-top:auto;padding-top:.78rem;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:.5rem;color:var(--muted);font-size:.8125rem}
    .sound-test{min-height:2.15rem;background:transparent;padding:.25rem .52rem;color:var(--muted);font-weight:550;white-space:nowrap}
    .sound-test:disabled{opacity:.55}
    .bottom{display:flex;align-items:center;justify-content:space-between;gap:.65rem;flex-wrap:wrap;padding-top:1.05rem;color:var(--muted);font-size:.8125rem;line-height:1.45}
    kbd{display:inline-block;padding:.08rem .35rem;margin-right:.18rem;border:1px solid #404741;border-radius:.3rem;background:#1d211e;color:#dce1d9;font:inherit}
    .shortcuts{display:flex;gap:.8rem;flex-wrap:wrap}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .focus-view{overflow:hidden}
    .focus-view .clock{
      position:fixed;inset:0 0 auto;z-index:2;height:100vh;height:100dvh;min-height:0;overflow:hidden;
      display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.5rem;border:0;border-radius:0;
      padding:max(.5rem,env(safe-area-inset-top)) max(.65rem,env(safe-area-inset-right))
        max(.5rem,env(safe-area-inset-bottom)) max(.65rem,env(safe-area-inset-left));
    }
    .focus-view .readout{min-width:0}
    .focus-view .dial{width:100%;height:100%;aspect-ratio:auto;margin:0;min-height:0}
    .focus-view .dial::before,.focus-view .dial::after{inset:auto 0 0;height:2px;border:0;border-radius:1px}
    .focus-view .dial::before{background:#3d4439;mask:none;opacity:1}
    .focus-view .dial::after{background:var(--signal);transform-origin:left;transform:scaleX(calc(1 - var(--offset,0) / 100))}
    .focus-view .ring,.focus-view .time-caption,.focus-view .sequence{display:none}
    .focus-view .dial-content{width:100%;height:100%;grid-template-rows:auto minmax(0,1fr);gap:.15rem}
    .focus-view .digits-frame{container-type:size;display:grid;place-items:center;width:100%;height:100%;min-width:0;min-height:0}
    .focus-view .digits{
      font-size:clamp(1.25rem, min(35vw, calc(116vh - 9rem)), 116vh);
      font-size:min(35cqw,116cqh);line-height:.82;letter-spacing:-.055em;padding-right:.055em;
      white-space:nowrap;-webkit-text-size-adjust:100%;text-size-adjust:100%;
    }
    .focus-view .actions{display:flex;flex-direction:row-reverse;justify-content:space-between}
    .focus-view .primary,.focus-view .reset{min-height:clamp(2.75rem,8.5vmin,3.25rem);white-space:nowrap}
    .focus-view .primary{min-width:clamp(7rem,20vw,13rem)}
    .focus-view .exit-focus{display:inline-flex}
    .focus-view .top,.focus-view .intro,.focus-view .settings,.focus-view .bottom{visibility:hidden}
    .clock-head-end{display:flex;align-items:center;gap:.5rem}
    .exit-focus{display:none;min-height:2.25rem;white-space:nowrap}
    @media(max-width:53rem){.top-inner,.shell{width:min(100% - 2rem,47rem)}.grid{grid-template-columns:minmax(0,1fr) minmax(17rem,.87fr);gap:.75rem}.clock,.settings{padding-inline:.9rem}.dial{width:min(100%,17.5rem)}.stepper{gap:.12rem}.number{min-width:3.55rem}}
    @media(max-width:43rem){.grid{grid-template-columns:1fr;gap:1rem}.top-inner,.shell{width:min(100% - 1.5rem,32rem)}.top-inner{min-height:3.85rem}.shell{padding-top:1.35rem}.intro{margin-bottom:1rem}.dial{width:min(100%,17.5rem);margin-block:.6rem .45rem}.clock,.settings{padding-inline:1rem}.settings{padding-top:1rem}.sequence{padding-bottom:.85rem}.shortcuts{display:none}}
    @media(max-width:25rem){.quiet{min-width:2.65rem}.utility-label{display:none}.dial{width:min(100%,15.4rem)}.dial::after{inset:1.25rem}.clock,.settings{padding-inline:.75rem}.settings-head{margin-bottom:.8rem}}
    @media(max-width:36rem){.focus-view .next{display:none}}

    @media (max-width:43rem) and (orientation:portrait), (max-height:36rem) and (orientation:landscape) {
      .focus-view .dial{grid-template: auto minmax(0,1fr) / minmax(0,1fr);row-gap:.15rem}
      .focus-view .dial::before,.focus-view .dial::after{display:none}
      .focus-view .dial-content{display:contents}
      .focus-view .phase-tag{grid-area:1 / 1 / 2 / -1}
      .focus-view .digits-frame{grid-area:2 / 1}
      .focus-view .ring{
        display:block;position:static;grid-area:2 / 1;width:100%;height:100%;min-width:0;min-height:0;transform:none;
      }
      .focus-view .ring-track{stroke:var(--signal);stroke-width:3;opacity:.55}
      .focus-view .ring-progress{stroke-width:4;transform-box:view-box;transform-origin:center;transform:rotate(-90deg)}
      .focus-view .clock[data-warning="true"] .ring-track,.focus-view .clock[data-phase="done"] .ring-track{opacity:.92}
    }
    @media (max-width:43rem) and (orientation:portrait) {
      .focus-view .digits{font-size:min(32.5vw,calc(31vh - 2.8rem));font-size:min(32.5cqw,31.2cqh)}
    }
    @media (max-height:36rem) and (orientation:landscape) {
      .focus-view .dial{grid-template-columns:minmax(0,20%) minmax(0,1fr);column-gap:clamp(.45rem,2vw,1rem)}
      .focus-view .digits-frame{grid-column:2}
      .focus-view .digits{font-size:min(27vw,calc(116vh - 9rem));font-size:min(35cqw,116cqh)}
    }
  </style>
</head>
<body>
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7.5"/><path d="M9.5 2.5h5M12 2.5v4m5.3 2.2 2-2M12 10v4l2.5 1.5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm5 4 5 6m0-6-5 6"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></symbol>
    <symbol id="i-exit" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M4 15h5v5m11-5h-5v5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14" stroke-width="3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 1 2.3 5.7M4 12V6m0 6h6"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8 4-8 4-8-4 8-4Zm-8 8 8 4 8-4M4 16l8 4 8-4"/></symbol>
  </svg>

  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="brand-icon"><svg aria-hidden="true"><use href="#i-timer"/></svg></span>間歇訓練</div>
      <div class="utilities">
        <button class="quiet" id="sound" type="button" aria-label="提示音" aria-pressed="true"><svg aria-hidden="true"><use href="#i-sound"/></svg><span class="utility-label">提示音</span></button>
        <button class="quiet" id="focus" type="button" aria-label="專注模式" aria-pressed="false"><svg aria-hidden="true"><use href="#i-full"/></svg><span class="utility-label">專注模式</span></button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div class="intro"><h1>訓練計時器</h1></div>
    <div class="grid">
      <section class="clock" id="clock" data-phase="idle" aria-label="計時器">
        <div class="clock-head">
          <span class="round-badge"><svg aria-hidden="true"><use href="#i-layers"/></svg><span id="round">第 1 / 3 組</span></span>
          <div class="clock-head-end"><span class="next" id="next">接下來　預備 · 10 秒</span><button type="button" class="quiet exit-focus" id="exit-focus"><svg aria-hidden="true"><use href="#i-exit"/></svg>離開專注</button></div>
        </div>
        <div class="readout">
          <div class="dial" id="dial">
            <svg class="ring" aria-hidden="true" viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="47"/><circle class="ring-progress" cx="50" cy="50" r="47" pathLength="100"/></svg>
            <div class="dial-content">
              <span class="phase-tag" id="phase" role="status">就緒</span>
              <div class="digits-frame"><div class="digits" id="digits" role="timer" aria-live="off">02:00</div></div>
              <span class="time-caption" id="caption">訓練時間</span>
            </div>
          </div>
          <ol class="sequence" aria-label="計時順序" id="sequence">
            <li data-stage="prep"><span>預備</span></li>
            <li data-stage="train"><span>訓練</span></li>
            <li data-stage="rest"><span>休息</span></li>
          </ol>
        </div>
        <div class="actions">
          <button type="button" class="primary" id="primary"><svg aria-hidden="true"><use href="#i-play"/></svg><span>開始計時</span></button>
          <button type="button" class="reset" id="reset" disabled><svg aria-hidden="true"><use href="#i-reset"/></svg>重設</button>
        </div>
      </section>

      <section class="settings" aria-labelledby="settings-title">
        <div class="settings-head"><h2 id="settings-title">計時設定</h2><span class="config-status" id="config-status"></span></div>
        <fieldset class="presets" id="presets"><legend class="sr-only">訓練預設</legend>
          <button type="button" class="preset" data-preset="quick" aria-pressed="false">快速</button>
          <button type="button" class="preset" data-preset="standard" aria-pressed="true">標準</button>
          <button type="button" class="preset" data-preset="extended" aria-pressed="false">多組</button>
        </fieldset>
        <fieldset class="fields" id="fields"><legend class="sr-only">自訂計時</legend></fieldset>
        <div class="settings-foot"><span id="sound-status">語音播報及最後 3 秒提示</span><button type="button" class="sound-test" id="sound-test">試聽提示</button></div>
      </section>
    </div>
    <footer class="bottom">
      <div class="shortcuts"><span><kbd>Space</kbd> 開始／暫停</span><span><kbd>R</kbd> 重設</span><span><kbd>F</kbd> 專注模式</span></div>
      <span id="device-note">計時時請讓此頁保持在前景。</span>

  <script>
  'use strict';

  const $ = (id) => document.getElementById(id);
  const presets = {
    quick: {prep: 5, train: 60, rest: 15, rounds: 3},
    standard: {prep: 10, train: 120, rest: 20, rounds: 3},
    extended: {prep: 10, train: 120, rest: 30, rounds: 6},
  };
  const fields = {
    prep: {label: '預備', note: '設為 0 可略過', min: 0, max: 999, step: 5, unit: '秒'},
    train: {label: '訓練', note: '', min: 1, max: 999, step: 5, unit: '秒'},
    rest: {label: '休息', note: '設為 0 可略過', min: 0, max: 999, step: 5, unit: '秒'},
    rounds: {label: '訓練組數', note: '', min: 1, max: 99, step: 1, unit: '組'},
  };
  const names = {prep: '預備', train: '訓練', rest: '休息'};
  const storageKey = 'archery-timer.preferences.v1';
  let storageAvailable = true;

  function loadPreferences() {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      return saved && typeof saved === 'object' ? saved : {};
    } catch {
      return {};
    }
  }

  function sanitize(key, raw, fallback) {
    const {min, max} = fields[key];
    if (raw === '' || raw == null || !Number.isFinite(Number(raw))) return fallback;
    return Math.max(min, Math.min(max, Math.round(Number(raw))));
  }

  const saved = loadPreferences();
  const savedConfig = {...saved.config, train: saved.config?.train ?? saved.config?.shoot};
  let config = Object.fromEntries(Object.keys(fields).map((key) => [key,
    sanitize(key, savedConfig[key], presets.standard[key])]));
  let soundEnabled = saved.sound !== false;
  let plan = [];
  let index = 0;
  let mode = 'idle';
  let deadline = 0;
  let pausedMs = null;
  let previousSeconds = 0;
  let announcement = null;
  let interval = null;
  let focusMode = false;
  let audio = null;
  const audioStartDelay = .015;
  const voiceBuffers = {};
  const activeSounds = new Set();
  let screenLock = null;
  let wakePending = false;
  const inputs = {};

  function savePreferences() {
    try {
      localStorage.setItem(storageKey, JSON.stringify({config, sound: soundEnabled}));
    } catch {
      storageAvailable = false;
    }
  }

  function setText(element, value) {
    if (element.textContent !== value) element.textContent = value;
  }

  function drawSettings() {
    const locked = mode === 'running' || mode === 'paused';
    $('presets').disabled = locked;
    $('fields').disabled = locked;
    drawSound();
    const selected = Object.keys(presets).find((key) => Object.keys(fields)
      .every((field) => presets[key][field] === config[field]));
    for (const button of $('presets').querySelectorAll('[data-preset]')) {
      button.setAttribute('aria-pressed', String(button.dataset.preset === selected));
    }
    setText($('config-status'), locked ? '計時中鎖定' : storageAvailable ? '自動儲存' : '僅本次有效');
    for (const [key, input] of Object.entries(inputs)) {
      const {min, max} = fields[key];
      input.value = config[key];
      $(`${key}-minus`).disabled = config[key] === min;
      $(`${key}-plus`).disabled = config[key] === max;
    }
  }

  function setConfig(key, raw) {
    if ($('fields').disabled) return;
    config[key] = sanitize(key, raw, config[key]);
    applySettings();
  }

  function applySettings() {
    if (mode === 'done') {
      silence();
      mode = 'idle';
    }
    savePreferences();
    drawSettings();
    render();
  }

  for (const [key, field] of Object.entries(fields)) {
    const {label, note, min, max, step, unit} = field;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<label class="field-label" for="${key}">${label}${note ? `<span class="field-note">${note}</span>` : ''}</label>
      <div class="stepper"><button type="button" class="step" id="${key}-minus" aria-label="${label}減少 ${step} ${unit}">−</button>
      <span class="number"><input id="${key}" type="number" min="${min}" max="${max}" step="1" inputmode="numeric" aria-label="${label}（${unit}）"><span class="suffix" aria-hidden="true">${unit}</span></span>
      <button type="button" class="step" id="${key}-plus" aria-label="${label}增加 ${step} ${unit}">+</button></div>`;
    $('fields').append(row);
    inputs[key] = $(key);
    $(key).addEventListener('change', (event) => setConfig(key, event.target.value));
    $(key).addEventListener('keydown', (event) => {
      if (event.key === 'Enter') event.target.blur();
    });
    $(`${key}-minus`).addEventListener('click', () => setConfig(key, config[key] - step));
    $(`${key}-plus`).addEventListener('click', () => setConfig(key, config[key] + step));
  }

  $('presets').addEventListener('click', (event) => {
    const preset = event.target.closest('[data-preset]')?.dataset.preset;
    if (!preset || $('presets').disabled) return;
    config = {...presets[preset]};
    applySettings();
  });

  function buildPlan(settings = config) {
    const stages = [];
    for (let round = 1; round <= settings.rounds; round += 1) {
      if (settings.prep) stages.push({name: 'prep', round, seconds: settings.prep});
      stages.push({name: 'train', round, seconds: settings.train});
      if (settings.rest && round < settings.rounds) {
        stages.push({name: 'rest', round, seconds: settings.rest});
      }
    }
    return stages;
  }

  function openAudio() {
    try {
      const session = navigator.audioSession;
      if (session) session.type = 'playback';
    } catch {
      // Some browsers restrict changing the audio session type.
    }
    try {
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      if (!AudioEngine) return;
      if (!audio) {
        audio = new AudioEngine();
        // Embedded 16 kHz mono PCM is ready even when preparation is skipped.
        for (const [name, encoded] of Object.entries(JSON.parse($('voice-recordings').textContent))) {
          const bytes = Uint8Array.from(atob(encoded), (byte) => byte.charCodeAt(0));
          const samples = new DataView(bytes.buffer);
          const buffer = audio.createBuffer(1, bytes.length / 2, 16000);
          const channel = buffer.getChannelData(0);
          for (let i = 0; i < channel.length; i += 1) {
            channel[i] = samples.getInt16(i * 2, true) / 32768;
          }
          voiceBuffers[name] = buffer;
        }
      }
      if (audio.state !== 'running') audio.resume().catch(() => {});
    } catch {
      // The countdown remains available without audio.
    }
  }

  function playSound(source, output, start, onEnded) {
    activeSounds.add(source);
    source.onended = () => {
      activeSounds.delete(source);
      source.disconnect();
      if (output !== source) output.disconnect();
      onEnded?.();
    };
    source.start(start);
  }

  function speak(name, delay = 0, onEnded) {
    const buffer = voiceBuffers[name];
    if (!soundEnabled || !audio || !buffer) return 0;
    const source = audio.createBufferSource();
    source.buffer = buffer;
    source.connect(audio.destination);
    playSound(source, source, audio.currentTime + delay + audioStartDelay, onEnded);
    return buffer.duration;
  }

  function beep(delay = 0) {
    if (!soundEnabled || !audio) return;
    const start = audio.currentTime + delay + audioStartDelay;
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.type = 'triangle';
    oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(.001, start);
    gain.gain.exponentialRampToValueAtTime(.38, start + .012);
    gain.gain.exponentialRampToValueAtTime(.001, start + .105);
    oscillator.connect(gain).connect(audio.destination);
    playSound(oscillator, gain, start);
    oscillator.stop(start + .105);
  }

  function beginCountdown(startAt) {
    announcement = null;
    previousSeconds = plan[index].seconds;
    deadline = startAt + previousSeconds * 1000;
    if (previousSeconds <= 3) beep();
  }

  function enterStage(now, startAt = now) {
    const pending = {};
    const duration = speak(plan[index].name, 0, () => {
      if (announcement !== pending) return;
      const endedAt = Date.now();
      beginCountdown(endedAt);
      render(endedAt);
    });
    if (!duration) {
      beginCountdown(startAt);
      return;
    }
    // If the browser blocks playback, the timer still needs to start.
    pending.fallbackAt = now + (duration + audioStartDelay) * 1000 + 500;
    announcement = pending;
  }

  function silence() {
    announcement = null;
    for (const source of activeSounds) source.stop();
    activeSounds.clear();
  }

  function drawSound() {
    $('sound').setAttribute('aria-pressed', String(soundEnabled));
    $('sound').querySelector('use').setAttribute('href', soundEnabled ? '#i-sound' : '#i-mute');
    $('sound-test').disabled = !soundEnabled || mode === 'running' || mode === 'paused';
    setText($('sound-status'), soundEnabled ? '語音播報及最後 3 秒提示' : '提示音已關閉');
  }

  $('sound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    if (soundEnabled) {
      openAudio();
    } else {
      const wasAnnouncing = announcement !== null;
      silence();
      if (wasAnnouncing) {
        const now = Date.now();
        beginCountdown(now);
        render(now);
      }
    }
    drawSound();
    savePreferences();
    if (!storageAvailable) setText($('config-status'), '僅本次有效');
  });

  $('sound-test').addEventListener('click', () => {
    openAudio();
    silence();
    const demo = buildPlan({prep: 4, train: 4, rest: 4, rounds: 2});
    let start = 0;
    for (const {name, seconds} of demo) {
      start += speak(name, start);
      for (let remaining = 3; remaining > 0; remaining -= 1) {
        beep(start + seconds - remaining);
      }
      start += seconds;
    }
    speak('done', start);
  });

  async function keepScreenOn() {
    if (!navigator.wakeLock || document.hidden || screenLock || wakePending || mode !== 'running') return;
    wakePending = true;
    try {
      const lock = await navigator.wakeLock.request('screen');
      if (mode !== 'running' || document.hidden) {
        await lock.release();
        return;
      }
      screenLock = lock;
      lock.addEventListener('release', () => {
        if (screenLock === lock) screenLock = null;
      }, {once: true});
    } catch {
      // Some browsers or system settings prevent a screen wake lock.
    } finally {
      wakePending = false;
    }
  }

  function stopInterval() {
    clearInterval(interval);
    interval = null;
    if (screenLock) {
      screenLock.release().catch(() => {});
      screenLock = null;
    }
  }

  function startInterval() {
    interval = setInterval(tick, 45);
    keepScreenOn();
  }

  function formatTime(seconds) {
    const part = (n) => String(n).padStart(2, '0');
    return `${part(Math.floor(seconds / 60))}:${part(seconds % 60)}`;
  }

  function render(now = Date.now()) {
    const stage = plan[index];
    const running = mode === 'running';
    const paused = mode === 'paused';
    const active = running || paused;
    const finished = mode === 'done';
    const phase = active ? stage.name : mode;
    const duration = active ? stage.seconds : config.train;
    const fullMs = duration * 1000;
    const ms = running && !announcement ? Math.max(0, deadline - now) : paused ? pausedMs ?? fullMs : finished ? 0 : fullMs;
    const seconds = Math.ceil(ms / 1000);
    const round = active ? stage.round : finished ? plan.at(-1).round : 1;
    const total = config.rounds;
    const next = active ? plan[index + 1] : config.prep ? {name: 'prep', seconds: config.prep} : {name: 'train', seconds: config.train};

    $('clock').dataset.phase = phase;
    $('clock').dataset.warning = String(running && !announcement && phase === 'train' && seconds <= 3);
    $('dial').style.setProperty('--offset', (100 * (1 - ms / fullMs)).toFixed(2));
    setText($('round'), `第 ${round} / ${total} 組`);
    setText($('next'), finished ? '' : next ? `接下來　${names[next.name]} · ${next.seconds} 秒` : '接下來　訓練結束');
    setText($('phase'), paused ? `已暫停 · ${names[phase]}` : active ? names[phase] : finished ? '訓練結束' : '就緒');
    setText($('digits'), formatTime(seconds));
    setText($('caption'), finished ? `本次共 ${total} 組` : active ? '剩餘時間' : '訓練時間');
    $('reset').disabled = mode === 'idle';
    const primaryIcon = running ? '#i-pause' : '#i-play';
    const use = $('primary').querySelector('use');
    if (use.getAttribute('href') !== primaryIcon) use.setAttribute('href', primaryIcon);
    setText($('primary').querySelector('span'), running ? '暫停' : paused ? '繼續計時' : finished ? '再練一次' : '開始計時');
    for (const item of $('sequence').children) {
      const name = item.dataset.stage;
      item.hidden = name === 'prep' && !config.prep || name === 'rest' && (!config.rest || config.rounds === 1);
      item.dataset.current = String(active && name === phase);
    }
  }

  function tick(now = Date.now()) {
    if (mode !== 'running') return;
    if (announcement) {
      if (now >= announcement.fallbackAt) {
        silence();
        beginCountdown(now);
        render(now);
      }
      return;
    }
    let changedStage = false;
    while (now >= deadline) {
      const boundary = deadline;
      index += 1;
      if (index === plan.length) {
        mode = 'done';
        stopInterval();
        speak('done');
        drawSettings();
        render(now);
        return;
      }
      if (now - boundary < 750) {
        enterStage(now, boundary);
        render(now);
        return;
      }
      deadline += plan[index].seconds * 1000;
      changedStage = true;
    }
    const seconds = Math.ceil((deadline - now) / 1000);
    if (!changedStage && seconds <= 3 && seconds < previousSeconds) {
      beep();
    }
    previousSeconds = seconds;
    render(now);
  }

  function handlePrimary() {
    const now = Date.now();
    const wasRunning = mode === 'running';
    tick(now);
    if (wasRunning && mode === 'done') return;
    if (mode === 'running') {
      pausedMs = announcement ? null : deadline - now;
      mode = 'paused';
      stopInterval();
      silence();
    } else if (mode === 'paused') {
      if (soundEnabled) openAudio();
      mode = 'running';
      if (pausedMs === null) enterStage(now);
      else deadline = now + pausedMs;
      startInterval();
    } else {
      if (soundEnabled) openAudio();
      silence();
      plan = buildPlan();
      index = 0;
      mode = 'running';
      enterStage(now);
      startInterval();
    }
    drawSettings();
    render(now);
  }

  function resetTimer() {
    if (mode === 'idle') return;
    stopInterval();
    silence();
    mode = 'idle';
    if (document.activeElement === $('reset')) $('primary').focus();
    drawSettings();
    render();
  }

  function setFocusMode(enabled, requestNative = true) {
    focusMode = enabled;
    document.body.classList.toggle('focus-view', enabled);
    $('focus').setAttribute('aria-pressed', String(enabled));
    if (enabled) {
      $('exit-focus').focus();
      if (requestNative && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    } else {
      if (requestNative && document.fullscreenElement) document.exitFullscreen().catch(() => {});
      $('focus').focus();
    }
  }

  $('primary').addEventListener('click', handlePrimary);
  $('reset').addEventListener('click', resetTimer);
  $('focus').addEventListener('click', () => setFocusMode(true));
  $('exit-focus').addEventListener('click', () => setFocusMode(false));
  document.addEventListener('fullscreenchange', () => {
    if (focusMode && !document.fullscreenElement) setFocusMode(false, false);
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    tick();
    keepScreenOn();
  });
  document.addEventListener('keydown', (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || event.repeat || event.defaultPrevented) return;
    const key = event.key.toLowerCase();
    if (key === 'escape' && focusMode) {
      setFocusMode(false);
      return;
    }
    if (event.target.closest('input,select,textarea,[contenteditable="true"]')) return;
    if (key === ' ' && !event.target.closest('button,a')) {
      event.preventDefault();
      handlePrimary();
    }
    if (key === 'r') resetTimer();
    if (key === 'f') setFocusMode(!focusMode);
  });

  savePreferences();
  drawSettings();
  render();
  </script>
</body>
</html>
